name: Launch All Chunks

on:
  workflow_dispatch:
    inputs:
      num_chunks:
        description: 'Number of parallel chunks (default 20)'
        required: true
        default: '20'
  schedule:
    - cron: '0 0 * * 0'  # every Sunday — check for new devices

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pandas openpyxl

      - name: Build missing device chunks and commit
        env:
          PAT_TOKEN:  ${{ secrets.PAT_TOKEN }}
          REPO:       ${{ github.repository }}
          NUM_CHUNKS: ${{ github.event.inputs.num_chunks || '20' }}
        run: |
          python - << 'PYEOF'
          import json, math, os, time
          import requests as req

          pat      = os.environ["PAT_TOKEN"]
          repo     = os.environ["REPO"]
          n_chunks = int(os.environ["NUM_CHUNKS"])

          import pandas as pd
          from pathlib import Path

          # Step 1: Deduplicate master CSV and rebuild seen_ids from it
          if Path("gsmarena_devices.csv").exists():
              try:
                  df = pd.read_csv("gsmarena_devices.csv", encoding="utf-8-sig", low_memory=False)
                  before = len(df)
                  df = df.drop_duplicates(subset=["URL"], keep="last")
                  after = len(df)
                  if before != after:
                      df.to_csv("gsmarena_devices.csv", index=False, encoding="utf-8-sig")
                      print(f"Deduplicated master CSV: {before} -> {after} rows (removed {before-after})", flush=True)
                  else:
                      print(f"Master CSV already clean: {after} rows", flush=True)
                  # Rebuild seen_ids from actual CSV
                  csv_urls = list(df["URL"].dropna().tolist())
                  with open("seen_ids.json", "w") as f:
                      json.dump(csv_urls, f)
                  print(f"seen_ids rebuilt from CSV: {len(csv_urls)} URLs", flush=True)
              except Exception as e:
                  print(f"Could not deduplicate: {e}", flush=True)

          # Load all discovered devices
          with open("discovered_devices.json") as f:
              all_devices = json.load(f)

          # Load seen ids (just rebuilt from CSV)
          seen = set()
          try:
              with open("seen_ids.json") as f:
                  seen = set(json.load(f))
          except: pass

          # Get ONLY missing devices
          missing = [d for d in all_devices if d["url"] not in seen]
          print(f"Total: {len(all_devices)} | Done: {len(seen)} | Missing: {len(missing)}", flush=True)

          if not missing:
              print("Nothing to scrape — all done!", flush=True)
              exit(0)

          # Write missing devices to file — chunks will load this
          with open("missing_devices.json", "w") as f:
              json.dump(missing, f)
          print(f"Saved {len(missing)} missing devices to missing_devices.json", flush=True)

          PYEOF

      - name: Commit deduped CSV and missing_devices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add missing_devices.json seen_ids.json gsmarena_devices.csv gsmarena_devices.xlsx 2>/dev/null || true
          git diff --staged --quiet || git commit -m "missing_devices.json — $(python3 -c "import json; d=json.load(open('missing_devices.json')); print(len(d))") devices to scrape"
          git pull --rebase origin main || true
          git push
          echo "Committed"

      - name: Launch chunk jobs
        env:
          PAT_TOKEN:  ${{ secrets.PAT_TOKEN }}
          REPO:       ${{ github.repository }}
          NUM_CHUNKS: ${{ github.event.inputs.num_chunks || '20' }}
        run: |
          python - << 'PYEOF'
          import json, math, os, time
          import requests as req

          pat      = os.environ["PAT_TOKEN"]
          repo     = os.environ["REPO"]
          n_chunks = int(os.environ["NUM_CHUNKS"])

          with open("missing_devices.json") as f:
              missing = json.load(f)

          chunk_size = math.ceil(len(missing) / n_chunks)
          headers = {
              "Accept":        "application/vnd.github.v3+json",
              "Authorization": f"token {pat}",
          }

          launched = 0
          for i in range(n_chunks):
              start = i * chunk_size
              end   = min(start + chunk_size, len(missing))
              if start >= len(missing):
                  break
              r = req.post(
                  f"https://api.github.com/repos/{repo}/dispatches",
                  headers=headers,
                  json={
                      "event_type": "scrape_chunk",
                      "client_payload": {
                          "chunk_id":    str(i),
                          "chunk_start": str(start),
                          "chunk_end":   str(end),
                      }
                  }
              )
              if r.status_code == 204:
                  print(f"Chunk {i} launched: devices {start}-{end} ({end-start} devices)", flush=True)
                  launched += 1
              else:
                  print(f"Chunk {i} FAILED: {r.status_code} {r.text}", flush=True)
              time.sleep(1)

          print(f"Launched {launched} chunks", flush=True)

          # Save the run timestamp so merge knows which runs to collect
          import datetime
          with open("launch_time.json", "w") as f:
              json.dump({"launched_at": datetime.datetime.utcnow().isoformat(), "chunks": launched}, f)
          PYEOF

      - name: Wait for all chunks then trigger merge
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO:      ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import os, requests, time, json

          pat  = os.environ["PAT_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"token {pat}",
              "Accept": "application/vnd.github.v3+json"
          }

          with open("launch_time.json") as f:
              info = json.load(f)
          expected = info["chunks"]
          print(f"Waiting for {expected} chunks to complete...", flush=True)

          max_wait = 3600  # max 1 hour
          poll_interval = 30
          elapsed = 0
          completed = 0

          while elapsed < max_wait:
              time.sleep(poll_interval)
              elapsed += poll_interval

              # Check recent scrape_chunk runs
              r = requests.get(
                  f"https://api.github.com/repos/{repo}/actions/runs?event=repository_dispatch&per_page=100",
                  headers=headers
              )
              runs = r.json().get("workflow_runs", [])

              # Count completed scrape runs since launch
              from datetime import datetime, timezone, timedelta
              cutoff = datetime.fromisoformat(info["launched_at"]) - timedelta(minutes=2)
              cutoff = cutoff.replace(tzinfo=timezone.utc)

              done = 0
              running = 0
              for run in runs:
                  created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                  if created >= cutoff and "scrape" in run["name"].lower():
                      if run["status"] == "completed":
                          done += 1
                      elif run["status"] in ("in_progress", "queued"):
                          running += 1

              print(f"  {elapsed}s elapsed | {done} done | {running} running", flush=True)

              if done >= expected and running == 0:
                  print(f"All {done} chunks completed!", flush=True)
                  break

              if running == 0 and elapsed > 300:
                  print(f"No more running jobs after {elapsed}s — triggering merge anyway", flush=True)
                  break

          # Trigger merge
          print("Triggering Merge Chunk Results...", flush=True)
          r = requests.post(
              f"https://api.github.com/repos/{repo}/dispatches",
              headers=headers,
              json={"event_type": "merge_chunks"}
          )
          print(f"Merge triggered: {r.status_code}", flush=True)
          PYEOF
