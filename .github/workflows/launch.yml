name: Launch All Chunks

on:
  workflow_dispatch:
    inputs:
      num_chunks:
        description: 'Number of parallel chunks (default 20)'
        required: true
        default: '20'
  schedule:
    - cron: '0 0 * * 0'  # every Sunday — check for new devices

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests pandas openpyxl

      - name: Build missing device chunks and commit
        env:
          PAT_TOKEN:  ${{ secrets.PAT_TOKEN }}
          REPO:       ${{ github.repository }}
          NUM_CHUNKS: ${{ github.event.inputs.num_chunks || '20' }}
        run: |
          python - << 'PYEOF'
          import json, math, os, time
          import requests as req

          pat      = os.environ["PAT_TOKEN"]
          repo     = os.environ["REPO"]
          n_chunks = int(os.environ["NUM_CHUNKS"])

          import pandas as pd
          from pathlib import Path

          # Step 1: Deduplicate master CSV and rebuild seen_ids from it
          if Path("gsmarena_devices.xlsx").exists():
              try:
                  df = pd.read_excel("gsmarena_devices.xlsx", engine="openpyxl")
                  before = len(df)
                  df = df.drop_duplicates(subset=["URL"], keep="last")
                  after = len(df)
                  if before != after:
                      df.to_excel("gsmarena_devices.xlsx", index=False, engine="openpyxl")
                      print(f"Deduplicated: {before} -> {after} rows", flush=True)
                  else:
                      print(f"Master clean: {after} rows", flush=True)
                  xlsx_urls = list(df["URL"].dropna().tolist())
                  with open("seen_ids.json", "w") as f:
                      json.dump(xlsx_urls, f)
                  print(f"seen_ids rebuilt: {len(xlsx_urls)} URLs", flush=True)
              except Exception as e:
                  print(f"Could not deduplicate: {e}", flush=True)

          # Load all discovered devices
          with open("discovered_devices.json") as f:
              all_devices = json.load(f)

          # Load seen ids (just rebuilt from CSV)
          seen = set()
          try:
              with open("seen_ids.json") as f:
                  seen = set(json.load(f))
          except: pass

          # Get ONLY missing devices
          missing = [d for d in all_devices if d["url"] not in seen]
          print(f"Total: {len(all_devices)} | Done: {len(seen)} | Missing: {len(missing)}", flush=True)

          if not missing:
              print("Nothing to scrape — all done!", flush=True)
              exit(0)

          # Write missing devices to file — chunks will load this
          with open("missing_devices.json", "w") as f:
              json.dump(missing, f)
          print(f"Saved {len(missing)} missing devices to missing_devices.json", flush=True)

          PYEOF

      - name: Commit deduped CSV and missing_devices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add missing_devices.json seen_ids.json gsmarena_devices.xlsx 2>/dev/null || true
          git diff --staged --quiet || git commit -m "missing_devices.json — $(python3 -c "import json; d=json.load(open('missing_devices.json')); print(len(d))") devices to scrape"
          git pull --rebase origin main || true
          git push
          echo "Committed"

      - name: Launch chunk jobs
        env:
          PAT_TOKEN:  ${{ secrets.PAT_TOKEN }}
          REPO:       ${{ github.repository }}
          NUM_CHUNKS: ${{ github.event.inputs.num_chunks || '20' }}
        run: |
          python - << 'PYEOF'
          import json, math, os, time
          import requests as req

          pat      = os.environ["PAT_TOKEN"]
          repo     = os.environ["REPO"]
          n_chunks = int(os.environ["NUM_CHUNKS"])

          with open("missing_devices.json") as f:
              missing = json.load(f)

          chunk_size = math.ceil(len(missing) / n_chunks)
          headers = {
              "Accept":        "application/vnd.github.v3+json",
              "Authorization": f"token {pat}",
          }

          launched = 0
          for i in range(n_chunks):
              start = i * chunk_size
              end   = min(start + chunk_size, len(missing))
              if start >= len(missing):
                  break
              r = req.post(
                  f"https://api.github.com/repos/{repo}/dispatches",
                  headers=headers,
                  json={
                      "event_type": "scrape_chunk",
                      "client_payload": {
                          "chunk_id":    str(i),
                          "chunk_start": str(start),
                          "chunk_end":   str(end),
                      }
                  }
              )
              if r.status_code == 204:
                  print(f"Chunk {i} launched: devices {start}-{end} ({end-start} devices)", flush=True)
                  launched += 1
              else:
                  print(f"Chunk {i} FAILED: {r.status_code} {r.text}", flush=True)
              time.sleep(1)

          print(f"Launched {launched} chunks", flush=True)
          PYEOF

      - name: Wait for all chunks to complete then trigger merge
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO:      ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import os, requests, time, json
          from datetime import datetime, timezone, timedelta

          pat  = os.environ["PAT_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"token {pat}",
              "Accept": "application/vnd.github.v3+json"
          }

          # How many chunks were launched
          with open("missing_devices.json") as f:
              missing = json.load(f)
          import math
          n_chunks = min(20, math.ceil(len(missing) / 1)) if missing else 0
          # actual chunks launched = ceil(missing / chunk_size)
          chunk_size = math.ceil(len(missing) / 20) if missing else 1
          expected = min(20, math.ceil(len(missing) / chunk_size)) if missing else 0
          print(f"Waiting for {expected} chunks ({len(missing)} devices) to complete...", flush=True)

          # Record launch time
          launch_time = datetime.now(timezone.utc)

          # Give GitHub 15s to spin up the jobs
          time.sleep(15)

          max_wait = 3600  # 1 hour max
          elapsed  = 15
          poll     = 20   # check every 20 seconds
          last_artifact_count = 0
          stable_count = 0  # how many polls with same artifact count

          while elapsed < max_wait:
              # Count artifacts uploaded — each completed chunk uploads one
              r = requests.get(
                  f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
                  headers=headers
              )
              runs = r.json().get("workflow_runs", [])

              # Count running scrape jobs (including retriggered ones)
              running = sum(
                  1 for run in runs
                  if "scrape" in run["name"].lower()
                  and run["status"] in ("in_progress", "queued")
              )

              # Count artifacts from all recent scrape runs
              artifacts = 0
              for run in runs:
                  created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
                  if created >= launch_time and "scrape" in run["name"].lower() and run["status"] == "completed":
                      ar = requests.get(
                          f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/artifacts",
                          headers=headers
                      )
                      artifacts += len([a for a in ar.json().get("artifacts", []) if a["name"].startswith("chunk-result-")])

              print(f"  {elapsed}s | {artifacts} artifacts | {running} running", flush=True)

              # Trigger merge when nothing is running and stable for 2 polls
              if running == 0:
                  if artifacts == last_artifact_count:
                      stable_count += 1
                      if stable_count >= 2:
                          print(f"Nothing running, {artifacts} artifacts stable — triggering merge", flush=True)
                          break
                  else:
                      stable_count = 0
                  last_artifact_count = artifacts

              time.sleep(poll)
              elapsed += poll

          # Trigger merge
          print("Triggering Merge Chunk Results...", flush=True)
          r = requests.post(
              f"https://api.github.com/repos/{repo}/dispatches",
              headers=headers,
              json={"event_type": "merge_chunks"}
          )
          print(f"Merge triggered: HTTP {r.status_code}", flush=True)
          PYEOF
