name: GSMArena Scraper

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours fallback
  workflow_dispatch:
  repository_dispatch:
    types: [resume_scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run scraper — 10 workers with proxies
        id: scraper
        run: python gsmarena_scraper_v5.py --workers 10
        continue-on-error: true
        timeout-minutes: 340

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gsmarena_devices.csv gsmarena_devices.xlsx seen_ids.json discovered_devices.json gsmarena_run.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Progress $(date -u '+%Y-%m-%d %H:%M UTC') — $(wc -l < gsmarena_devices.csv 2>/dev/null || echo 0) rows"
          git push

      - name: Trigger immediate resume with fresh IP if blocked
        if: steps.scraper.outcome == 'failure'
        run: |
          echo "Blocked — triggering new job with fresh IP in 30s..."
          sleep 30
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"resume_scrape"}'
