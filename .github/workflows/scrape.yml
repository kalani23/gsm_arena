name: GSMArena Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [resume_scrape]
  schedule:
    - cron: '0 */6 * * *'  # safety fallback only

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run scraper — direct GitHub IP, 10 workers, aggressive
        id: scraper
        run: python gsmarena_scraper_v5.py --workers 10
        continue-on-error: true
        timeout-minutes: 340

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gsmarena_devices.csv gsmarena_devices.xlsx seen_ids.json discovered_devices.json gsmarena_run.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Progress $(date -u '+%Y-%m-%d %H:%M UTC') — $(wc -l < gsmarena_devices.csv 2>/dev/null || echo 0) rows"
          git push

      - name: New IP — trigger fresh job immediately if blocked
        if: steps.scraper.outcome == 'failure'
        run: |
          echo "Blocked — spinning up new job with fresh GitHub IP..."
          sleep 15
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"resume_scrape"}'
          echo "New job triggered"
