name: GSMArena Scraper

on:
  workflow_dispatch:
    inputs:
      chunk_id:
        description: 'Chunk ID (0-19)'
        required: false
        default: 'all'
      chunk_start:
        description: 'Start index for this chunk'
        required: false
        default: '0'
      chunk_end:
        description: 'End index for this chunk'
        required: false
        default: '0'
  repository_dispatch:
    types: [scrape_chunk]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run scraper chunk
        id: scraper
        env:
          PYTHONUNBUFFERED: "1"
          CHUNK_ID:    ${{ github.event.client_payload.chunk_id || github.event.inputs.chunk_id || '0' }}
          CHUNK_START: ${{ github.event.client_payload.chunk_start || github.event.inputs.chunk_start || '0' }}
          CHUNK_END:   ${{ github.event.client_payload.chunk_end || github.event.inputs.chunk_end || '0' }}
          PAT_TOKEN:   ${{ secrets.PAT_TOKEN }}
          REPO:        ${{ github.repository }}
        run: python gsmarena_scraper_v5.py
        continue-on-error: true

      - name: Commit chunk result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin main && break || sleep 5
          done
          git add chunk_result_*.csv seen_ids.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Chunk ${{ github.event.client_payload.chunk_id || '0' }} done $(date -u '+%H:%M UTC')"
          for i in 1 2 3; do
            git push && break || (git pull --rebase origin main && sleep 3)
          done || true
