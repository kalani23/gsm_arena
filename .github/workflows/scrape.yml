name: GSMArena Scraper

on:
  schedule:
    - cron: '0 */6 * * *'   # fallback safety schedule every 6 hours
  workflow_dispatch:          # manual trigger
  repository_dispatch:        # triggered programmatically by previous run
    types: [resume_scrape]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # 6 hour max per run

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # needs PAT to trigger new workflows

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run scraper
        id: scraper
        run: |
          python gsmarena_scraper_v5.py --no-proxy --workers 1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit progress
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gsmarena_devices.csv gsmarena_devices.xlsx seen_ids.json discovered_devices.json gsmarena_run.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Progress $(date -u '+%Y-%m-%d %H:%M UTC') — $(wc -l < gsmarena_devices.csv 2>/dev/null || echo 0) rows"
          git push

      # If scraper exited with code 2 (blocked) — trigger a NEW job immediately
      # New job = new runner = new IP = automatic resume
      - name: Trigger immediate resume on new IP if blocked
        if: steps.scraper.outcome == 'failure'
        run: |
          echo "Scraper was blocked — triggering new job with fresh IP..."
          sleep 30  # brief pause before new IP request
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"resume_scrape"}'
          echo "New job triggered — fresh IP incoming"

      - name: Done if scraper completed successfully
        if: steps.scraper.outcome == 'success'
        run: echo "Scraper completed successfully — no resume needed"
