name: Merge Chunk Results

on:
  workflow_dispatch:
  repository_dispatch:
    types: [merge_chunks]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas openpyxl requests

      - name: Download all chunk artifacts
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO:      ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import os, requests, zipfile, io
          from pathlib import Path

          pat  = os.environ["PAT_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"token {pat}",
              "Accept": "application/vnd.github.v3+json"
          }

          # Get all artifacts from recent runs
          r = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100", headers=headers)
          artifacts = r.json().get("artifacts", [])

          chunk_artifacts = [a for a in artifacts if a["name"].startswith("chunk-result-") and not a["expired"]]
          print(f"Found {len(chunk_artifacts)} chunk artifacts", flush=True)

          Path("artifacts").mkdir(exist_ok=True)
          for art in chunk_artifacts:
              print(f"  Downloading {art['name']}...", flush=True)
              r = requests.get(art["archive_download_url"], headers=headers)
              z = zipfile.ZipFile(io.BytesIO(r.content))
              z.extractall("artifacts/")

          import glob
          files = glob.glob("artifacts/*.csv")
          print(f"Extracted {len(files)} CSV files", flush=True)
          PYEOF

      - name: Merge all results
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'PYEOF'
          import pandas as pd
          import glob, json
          from pathlib import Path
          from datetime import datetime, timezone

          # Load all chunk CSVs from artifacts
          chunk_files = glob.glob("artifacts/*.csv") + glob.glob("chunk_result_*.csv")
          print(f"Found {len(chunk_files)} chunk files to merge", flush=True)

          if not chunk_files:
              print("No chunk files found — nothing to merge", flush=True)
              exit(0)

          chunks = []
          for f in chunk_files:
              try:
                  df = pd.read_csv(f, encoding="utf-8-sig", low_memory=False)
                  if len(df) > 0:
                      chunks.append(df)
                      print(f"  {f}: {len(df)} rows", flush=True)
              except Exception as e:
                  print(f"  {f}: error — {e}", flush=True)

          if not chunks:
              print("No valid chunk data found", flush=True)
              exit(0)

          new_data = pd.concat(chunks, ignore_index=True)
          new_data = new_data.drop_duplicates(subset=["URL"], keep="last")
          print(f"Total new rows: {len(new_data)}", flush=True)

          # Dated new-devices file
          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          new_csv  = f"gsmarena_new_{date_str}.csv"
          new_xlsx = f"gsmarena_new_{date_str}.xlsx"
          if Path(new_csv).exists():
              try:
                  today = pd.read_csv(new_csv, encoding="utf-8-sig", low_memory=False)
                  new_data_combined = pd.concat([today, new_data], ignore_index=True).drop_duplicates(subset=["URL"], keep="last")
              except: new_data_combined = new_data
          else:
              new_data_combined = new_data
          new_data_combined.to_csv(new_csv, index=False, encoding="utf-8-sig")
          try: new_data_combined.to_excel(new_xlsx, index=False, engine="openpyxl")
          except: pass
          print(f"New devices file: {new_csv} ({len(new_data_combined)} rows)", flush=True)

          # Merge into master
          master_csv = "gsmarena_devices.csv"
          master_df = pd.DataFrame()
          if Path(master_csv).exists():
              try:
                  master_df = pd.read_csv(master_csv, encoding="utf-8-sig", low_memory=False)
                  print(f"Existing master: {len(master_df)} rows", flush=True)
              except: pass

          combined = pd.concat([master_df, new_data], ignore_index=True)
          combined = combined.drop_duplicates(subset=["URL"], keep="last")
          combined = combined.sort_values(
              ["Brand", "Model"],
              key=lambda x: x.str.lower().fillna(""),
              na_position="last"
          ).reset_index(drop=True)

          combined.to_csv(master_csv, index=False, encoding="utf-8-sig")
          try: combined.to_excel("gsmarena_devices.xlsx", index=False, engine="openpyxl")
          except: pass
          print(f"Master updated: {len(combined)} rows", flush=True)

          # Rebuild seen_ids from final master
          seen = list(combined["URL"].dropna().tolist())
          with open("seen_ids.json", "w") as f:
              json.dump(seen, f)
          print(f"seen_ids.json rebuilt: {len(seen)} URLs", flush=True)

          # Clean up old chunk files in repo
          for f in glob.glob("chunk_result_*.csv"):
              Path(f).unlink()
          print("Chunk files cleaned up", flush=True)
          PYEOF

      - name: Commit final results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add gsmarena_devices.csv gsmarena_devices.xlsx gsmarena_new_*.csv gsmarena_new_*.xlsx seen_ids.json
          git rm chunk_result_*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Merged $(date -u '+%Y-%m-%d %H:%M UTC') — $(wc -l < gsmarena_devices.csv) rows"
          git push
