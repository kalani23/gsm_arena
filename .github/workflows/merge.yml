name: Merge Chunk Results

on:
  workflow_dispatch:
  repository_dispatch:
    types: [merge_chunks]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas openpyxl requests

      - name: Download chunk artifacts from recent runs only
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO:      ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import os, requests, zipfile, io
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          pat  = os.environ["PAT_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"token {pat}",
              "Accept": "application/vnd.github.v3+json"
          }

          # Only get artifacts from last 2 hours
          cutoff = datetime.now(timezone.utc) - timedelta(hours=2)

          r = requests.get(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers=headers
          )
          all_runs = r.json().get("workflow_runs", [])

          # Only recent scrape runs
          recent_run_ids = []
          for run in all_runs:
              run_time = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if run_time > cutoff and "scrape" in run["name"].lower():
                  recent_run_ids.append(run["id"])

          print(f"Recent scrape runs (last 2h): {len(recent_run_ids)}", flush=True)

          Path("artifacts").mkdir(exist_ok=True)
          downloaded = 0

          for run_id in recent_run_ids:
              r = requests.get(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts",
                  headers=headers
              )
              artifacts = r.json().get("artifacts", [])
              for art in artifacts:
                  if art["name"].startswith("chunk-result-") and not art["expired"]:
                      print(f"  Downloading {art['name']}...", flush=True)
                      dl = requests.get(art["archive_download_url"], headers=headers)
                      try:
                          z = zipfile.ZipFile(io.BytesIO(dl.content))
                          for name in z.namelist():
                              data = z.read(name)
                              out_path = Path("artifacts") / f"run{run_id}_{name}"
                              out_path.write_bytes(data)
                          downloaded += 1
                      except Exception as e:
                          print(f"    Error extracting: {e}", flush=True)

          import glob
          xlsx_files = glob.glob("artifacts/*.xlsx")
          print(f"Downloaded {downloaded} artifacts | {len(xlsx_files)} xlsx files", flush=True)
          PYEOF

      - name: Merge all results into master xlsx
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'PYEOF'
          import pandas as pd
          import glob, json
          from pathlib import Path
          from datetime import datetime, timezone

          chunk_files = glob.glob("artifacts/*.xlsx")
          print(f"Chunk xlsx files: {len(chunk_files)}", flush=True)

          if not chunk_files:
              print("No chunk files found — nothing to merge", flush=True)
              exit(0)

          chunks = []
          for f in chunk_files:
              try:
                  df = pd.read_excel(f, engine="openpyxl")
                  if len(df) > 0:
                      chunks.append(df)
                      print(f"  {Path(f).name}: {len(df)} rows", flush=True)
              except Exception as e:
                  print(f"  {Path(f).name}: error — {e}", flush=True)

          if not chunks:
              print("No valid chunk data", flush=True)
              exit(0)

          new_data = pd.concat(chunks, ignore_index=True)
          new_data = new_data.drop_duplicates(subset=["URL"], keep="last")
          print(f"New rows: {len(new_data)}", flush=True)

          # Load master xlsx
          master_df = pd.DataFrame()
          if Path("gsmarena_devices.xlsx").exists():
              try:
                  master_df = pd.read_excel("gsmarena_devices.xlsx", engine="openpyxl")
                  master_df = master_df.drop_duplicates(subset=["URL"], keep="last")
                  print(f"Master: {len(master_df)} rows", flush=True)
              except Exception as e:
                  print(f"Master load error: {e}", flush=True)

          # Combine — new_data overrides master for same URLs
          combined = pd.concat([master_df, new_data], ignore_index=True)
          combined = combined.drop_duplicates(subset=["URL"], keep="last")
          combined = combined.sort_values(
              ["Brand", "Model"],
              key=lambda x: x.str.lower().fillna(""),
              na_position="last"
          ).reset_index(drop=True)
          print(f"Final: {len(combined)} rows (was {len(master_df)}, added {len(new_data)})", flush=True)

          # Save to temp first then rename to avoid corruption
          combined.to_excel("gsmarena_devices_new.xlsx", index=False, engine="openpyxl")
          import os
          os.replace("gsmarena_devices_new.xlsx", "gsmarena_devices.xlsx")
          print(f"Saved gsmarena_devices.xlsx ({len(combined)} rows)", flush=True)

          # Dated new devices file
          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          new_xlsx = f"gsmarena_new_{date_str}.xlsx"
          if Path(new_xlsx).exists():
              try:
                  today = pd.read_excel(new_xlsx, engine="openpyxl")
                  new_data = pd.concat([today, new_data], ignore_index=True).drop_duplicates(subset=["URL"], keep="last")
              except: pass
          new_data.to_excel(new_xlsx, index=False, engine="openpyxl")
          print(f"New devices: {new_xlsx} ({len(new_data)} rows)", flush=True)

          # Rebuild seen_ids
          seen = list(combined["URL"].dropna().tolist())
          with open("seen_ids.json", "w") as f:
              json.dump(seen, f)
          print(f"seen_ids: {len(seen)} URLs", flush=True)
          PYEOF

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add gsmarena_devices.xlsx seen_ids.json || true
          git add gsmarena_new_*.xlsx 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Merged $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
