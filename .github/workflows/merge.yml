name: Merge Chunk Results

on:
  workflow_dispatch:
  repository_dispatch:
    types: [merge_chunks]

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas openpyxl requests

      - name: Download chunk artifacts from latest Launch All Chunks run only
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO:      ${{ github.repository }}
        run: |
          python - << 'PYEOF'
          import os, requests, zipfile, io, json
          from pathlib import Path

          pat  = os.environ["PAT_TOKEN"]
          repo = os.environ["REPO"]
          headers = {
              "Authorization": f"token {pat}",
              "Accept": "application/vnd.github.v3+json"
          }

          # Find the latest Launch All Chunks run
          r = requests.get(
              f"https://api.github.com/repos/{repo}/actions/runs?event=workflow_dispatch&per_page=20",
              headers=headers
          )
          runs = r.json().get("workflow_runs", [])

          # Also check repository_dispatch runs (triggered by check_new)
          r2 = requests.get(
              f"https://api.github.com/repos/{repo}/actions/runs?event=repository_dispatch&per_page=20",
              headers=headers
          )
          runs += r2.json().get("workflow_runs", [])

          # Find latest scrape_chunk runs from last 2 hours
          import time
          from datetime import datetime, timezone, timedelta
          cutoff = datetime.now(timezone.utc) - timedelta(hours=4)

          r3 = requests.get(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers=headers
          )
          all_runs = r3.json().get("workflow_runs", [])

          # Get artifact IDs from recent scrape_chunk runs only
          recent_run_ids = []
          for run in all_runs:
              run_time = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if run_time > cutoff and "scrape" in run["name"].lower():
                  recent_run_ids.append(run["id"])

          print(f"Found {len(recent_run_ids)} recent scrape runs", flush=True)

          Path("artifacts").mkdir(exist_ok=True)
          downloaded = 0

          for run_id in recent_run_ids:
              r = requests.get(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts",
                  headers=headers
              )
              artifacts = r.json().get("artifacts", [])
              for art in artifacts:
                  if art["name"].startswith("chunk-result-") and not art["expired"]:
                      print(f"  Downloading {art['name']} from run {run_id}...", flush=True)
                      dl = requests.get(art["archive_download_url"], headers=headers)
                      z = zipfile.ZipFile(io.BytesIO(dl.content))
                      # Extract with unique name to avoid overwrite
                      for name in z.namelist():
                          data = z.read(name)
                          out_path = Path("artifacts") / f"run{run_id}_{name}"
                          out_path.write_bytes(data)
                      downloaded += 1

          print(f"Downloaded {downloaded} artifacts", flush=True)
          import glob
          files = glob.glob("artifacts/*.csv")
          print(f"Total CSV files: {len(files)}", flush=True)
          PYEOF

      - name: Merge all results into master
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - << 'PYEOF'
          import pandas as pd
          import glob, json
          from pathlib import Path
          from datetime import datetime, timezone

          chunk_files = glob.glob("artifacts/*.csv")
          print(f"Chunk files to merge: {len(chunk_files)}", flush=True)

          if not chunk_files:
              print("No chunk files — nothing to merge", flush=True)
              exit(0)

          chunks = []
          for f in chunk_files:
              try:
                  df = pd.read_csv(f, encoding="utf-8-sig", low_memory=False)
                  if len(df) > 0:
                      chunks.append(df)
                      print(f"  {Path(f).name}: {len(df)} rows", flush=True)
              except Exception as e:
                  print(f"  {f}: error — {e}", flush=True)

          if not chunks:
              print("No valid data in chunks", flush=True)
              exit(0)

          new_data = pd.concat(chunks, ignore_index=True)
          new_data = new_data.drop_duplicates(subset=["URL"], keep="last")
          print(f"New rows from chunks: {len(new_data)}", flush=True)

          # Load master CSV
          master_csv = "gsmarena_devices.csv"
          master_df = pd.DataFrame()
          if Path(master_csv).exists():
              master_df = pd.read_csv(master_csv, encoding="utf-8-sig", low_memory=False)
              before = len(master_df)
              master_df = master_df.drop_duplicates(subset=["URL"], keep="last")
              print(f"Master: {before} rows -> {len(master_df)} after dedup", flush=True)

          # Combine and deduplicate
          combined = pd.concat([master_df, new_data], ignore_index=True)
          combined = combined.drop_duplicates(subset=["URL"], keep="last")
          combined = combined.sort_values(
              ["Brand", "Model"],
              key=lambda x: x.str.lower().fillna(""),
              na_position="last"
          ).reset_index(drop=True)
          print(f"Final master: {len(combined)} rows", flush=True)

          # Save master
          combined.to_csv(master_csv, index=False, encoding="utf-8-sig")
          try:
              combined.to_excel("gsmarena_devices.xlsx", index=False, engine="openpyxl")
          except Exception as e:
              print(f"Excel save error: {e}", flush=True)

          # Save dated new-devices file
          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          new_csv  = f"gsmarena_new_{date_str}.csv"
          new_xlsx = f"gsmarena_new_{date_str}.xlsx"

          if Path(new_csv).exists():
              today = pd.read_csv(new_csv, encoding="utf-8-sig", low_memory=False)
              new_combined = pd.concat([today, new_data], ignore_index=True).drop_duplicates(subset=["URL"], keep="last")
          else:
              new_combined = new_data

          new_combined.to_csv(new_csv, index=False, encoding="utf-8-sig")
          try:
              new_combined.to_excel(new_xlsx, index=False, engine="openpyxl")
          except: pass
          print(f"New devices file: {new_csv} ({len(new_combined)} rows)", flush=True)

          # Rebuild seen_ids from final master only
          seen = list(combined["URL"].dropna().tolist())
          with open("seen_ids.json", "w") as f:
              json.dump(seen, f)
          print(f"seen_ids rebuilt: {len(seen)} URLs", flush=True)
          PYEOF

      - name: Commit everything
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add gsmarena_devices.csv gsmarena_devices.xlsx gsmarena_new_*.csv gsmarena_new_*.xlsx seen_ids.json
          git diff --staged --quiet || git commit -m "Merged $(date -u '+%Y-%m-%d %H:%M UTC') — $(python3 -c "import pandas as pd; print(len(pd.read_csv('gsmarena_devices.csv')))"  ) rows"
          git push
